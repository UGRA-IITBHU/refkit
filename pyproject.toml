[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refkit"
version = "0.1.0"
description = "Reference models of hardware blocks, written like Verilog in Python; translated to Verilog and proven with SymbiYosys"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refkit = ["guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
